  $('q').placeholder=t('search');[...$('so').options].forEach((o,i)=>o.textContent=t('sort')[i]);
  $('f1').textContent=t('shipNote')+' · '+t('cod');$('an').textContent='🚚 '+t('shipNote')+' · '+t('cod');$('tr').innerHTML=['tr1','tr2','tr3'].map(k=>`<span>${t(k)}</span>`).join('');drawSlider();$('stt').textContent=t('shopBy');$('tl').innerHTML=['hd','sw','jk','p','t','s','kn'].filter(k=>P.some(p=>p.k==k&&p.im)).map(k=>{const p=P.find(p=>p.k==k&&p.im);return `<div class="tile" onclick="go('${k}')"><img src="${p.im[p.c[0]][0]}" alt="" loading="lazy"><span>${t(k)}</span></div>`}).join('');$('f2').innerHTML='💬 '+t('wa')+' <span dir="ltr">01128181698</span>';
  const R=P.filter(p=>(cat=='all'||p.k==cat)&&(!qs||(p.n[0]+' '+p.n[1]).toLowerCase().includes(qs)));
  if(so==1)R.sort((a,b)=>a.p-b.p);if(so==2)R.sort((a,b)=>b.p-a.p);
  $('grid').innerHTML=R.length?R.map(p=>`<div class="card" onclick="openP(${p.id})"><div class="img">${p.im?`<img class="cimg" src="${p.im[p.c[0]][0]}" alt="" loading="lazy">`:garment(p.k,C[p.c[0]][0],0)}</div><div class="b">${nm(p)}<br><b>${p.p} ${t('cur')}</b><div class="sw">${p.c.map(i=>`<i style="background:${C[i][0]}"></i>`).join('')}</div>${p.s.every(z=>(p.o||[]).includes(z))?'<br><small>'+t('out')+'</small>':''}</div></div>`).join(''):`<p>${t('none')}</p>`;
}
function openP(id){sel={p:P.find(x=>x.id==id),c:0,s:null,v:0,ask:false};showP();$('ov').classList.add('on')}
function media(p,c,v,col){
  const ph=p.im&&p.im[p.c[c]];
  if(ph){const i=Math.min(v,ph.length-1);return `<img id="pm" src="${ph[i]}" alt=""><div class="views">${ph.map((u,j)=>`<img class="th ${j==i?'on':''}" src="${u}" alt="" onclick="sel.v=${j};showP()">`).join('')}</div>`}
  return `<div style="background:var(--soft);border-radius:12px;padding:10px">${garment(p.k,col,v,'g" style="height:230px')}</div><div class="views">${t('views').map((x,i)=>`<button class="${i==v?'on':''}" onclick="sel.v=${i};showP()">${garment(p.k,col,i,'g')}${x}</button>`).join('')}</div>`}
function showP(){
  const{p,c,s,v,ask}=sel,col=C[p.c[c]][0];
  $('bx').innerHTML=`<h3 style="margin:0 0 4px">${nm(p)} — ${p.p} ${t('cur')}</h3><p style="margin:0 0 6px;opacity:.8;font-size:14px">${(p.d||['',''])[L=='ar'?0:1]}</p><small style="display:block;margin-bottom:8px">🚚 ${t('shipNote')}</small>
  ${media(p,c,v,col)}
  <b>${t('color')}: ${cn(p.c[c])}</b><div class="opts">${p.c.map((ci,i)=>`<button class="cl ${i==c?'on':''}" style="background:${C[ci][0]}" onclick="sel.c=${i};sel.v=0;showP()"></button>`).join('')}</div>
  <b>${t('size')}</b><div class="opts">${p.s.map(z=>{const o=(p.o||[]).includes(z);return `<button class="sz ${z==s?'on':''} ${o?'out':''}" ${o?'disabled title="'+t('out')+'"':''} onclick="sel.s='${z}';sel.ask=true;showP()">${z}</button>`}).join('')}</div>
  <button class="btn g" style="margin:0 0 8px;padding:8px" onclick="sel.chart=!sel.chart;showP()">${t('chart')}</button>${sel.chart?chartHtml(p):''}
  ${ask?`<div class="ask">${t('ask').replace('{s}',s)}<button class="btn" onclick="addC(true)">${t('only')}</button><button class="btn g" onclick="addC(false)">${t('more')}</button></div>`:''}
  <button class="btn g" onclick="$('ov').classList.remove('on')">${t('close')}</button>`;
}
function addC(now){
  const{p,c,s}=sel,i=cart.find(x=>x.id==p.id&&x.c==p.c[c]&&x.s==s);
  if(i)i.q++;else cart.push({id:p.id,c:p.c[c],s,q:1});
  draw();if(now)showCart();else $('ov').classList.remove('on');
}
function total(){return cart.reduce((a,x)=>a+P.find(p=>p.id==x.id).p*x.q,0)}
function showCart(){
  $('ov').classList.add('on');
  $('bx').innerHTML=`<h3 style="margin:0">🛍️ ${t('cart')}</h3>`+(cart.length?cart.map((x,i)=>{const p=P.find(q=>q.id==x.id);return`<div class="row"><span>${x.q}× ${nm(p)}<br><small>${t('size')} ${x.s} · ${cn(x.c)}</small></span><span>${p.p*x.q} ${t('cur')}<br><a href="#" onclick="cart.splice(${i},1);draw();showCart();return false">${t('rm')}</a></span></div>`}).join('')+`<p style="margin:8px 0 2px">${t('sub')}: ${total()} ${t('cur')}<br>${t('shipL')}: ${SHIP} ${t('cur')}</p><p style="margin:2px 0"><b>${t('total')}: ${total()+SHIP} ${t('cur')}</b></p><small>🚚 ${t('shipNote')}</small>
  <input id="n" placeholder="${t('name')}"><input id="ph" placeholder="${t('phone')}"><textarea id="ad" placeholder="${t('addr')}"></textarea>
  <button class="btn" onclick="send()">${t('send')}</button>`:`<p>${t('empty')}</p>`)+`<button class="btn g" onclick="$('ov').classList.remove('on')">${t('close')}</button>`;
}
function send(){
  const n=$('n').value.trim(),ph=$('ph').value.trim(),ad=$('ad').value.trim();
  if(!n||!ph||!ad){alert(t('fill'));return}
  const lines=cart.map(x=>{const p=P.find(q=>q.id==x.id);return`${x.q}x ${p.n[1]} | ${x.s} | ${C[x.c][2]} | ${p.p*x.q}`});
  const msg=`one to one - New order\n${lines.join('\n')}\nSubtotal: ${total()} EGP\nShipping: ${SHIP} EGP\nTotal: ${total()+SHIP} EGP\nName: ${n}\nPhone: ${ph}\nAddress: ${ad}`;
  const u='https://wa.me/'+WA+'?text='+encodeURIComponent(msg);
  $('bx').innerHTML=`<h3 style="margin:0 0 8px">✅ ${L=='ar'?'الطلب جاهز':'Order ready'}</h3>
  <a class="btn" style="display:block;text-align:center;text-decoration:none" href="${u}" target="_blank" rel="noopener noreferrer">${L=='ar'?'افتح واتساب وابعت الطلب':'Open WhatsApp & send'}</a>
  <p style="font-size:13px">${L=='ar'?'لو واتساب مفتحش، انسخ الرسالة دي وابعتها على الرقم':'If WhatsApp does not open, copy this message and send it to'} <b dir="ltr">0${WA.slice(2)}</b></p>
  <textarea id="mg" readonly rows="7" onclick="this.select()">${msg}</textarea>
  <button class="btn g" onclick="var m=$('mg');m.select();try{navigator.clipboard.writeText(m.value)}catch(e){document.execCommand('copy')}">${L=='ar'?'نسخ الرسالة':'Copy message'}</button>
  <button class="btn g" onclick="$('ov').classList.remove('on')">${t('close')}</button>`;
}
$('lg').onclick=()=>{L=L=='ar'?'en':'ar';try{localStorage.setItem('o2o-lang',L)}catch(e){}draw();if($('ov').classList.contains('on'))sel&&document.querySelector('.views')?showP():showCart()};
let si=0,sn=0;
const BN=[['brand','','bn1s','all'],['hd','bn2t','bn2s','hd'],['jk','bn3t','bn3s','jk'],['s','bn4t','bn4s','all']];
function stp(d){si=(si+d+sn)%sn;drawSlider()}
function go(k){cat=k;draw();$('cats').scrollIntoView({behavior:'smooth'})}
function art(k){
  if(k=='brand')return `<svg class="art" viewBox="0 0 100 60"><circle cx="38" cy="30" r="22" fill="none" stroke="#fff" stroke-width="1.6"/><circle cx="62" cy="30" r="22" fill="none" stroke="#888" stroke-width="1.6"/></svg>`;
  return `<svg class="art" viewBox="0 0 100 100"><path d="${G[k]}" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/><path d="${G[k]}" fill="none" stroke="#fff" stroke-width=".6" stroke-dasharray="1.5 2" opacity=".7" transform="translate(50 50) scale(.9) translate(-50 -50)"/></svg>`}
function drawSlider(){
  const pr=id=>{const p=P.find(x=>x.id==id&&x.im);return p?{p}:null},b=i=>({b:BN[i]});
  const S=[b(0),b(1),pr(13),b(2),pr(12),b(3),pr(11)].filter(Boolean);sn=S.length;if(si>=sn)si=0;
  $('sl').innerHTML=S.map((x,i)=>{
    const on=i==si?'on':'';
    if(x.b){const[k,a,c,g]=x.b;return `<div class="sl ${on}">${art(k)}<div class="slt"><small>one to one</small><h2 class="${k=='brand'?'bd':''}">${k=='brand'?'ONE TO ONE':t(a)}</h2><p>${t(c)}</p><button class="btn" style="width:auto;padding:10px 26px" onclick="go('${g}')">${t('shop')}</button></div></div>`}
    const p=x.p;return `<div class="sl ${on}"><img src="${p.im[p.c[0]][0]}" alt=""><div class="slt"><small>${t('winter')}</small><h2>${nm(p)}</h2><p>${p.p} ${t('cur')}</p><button class="btn" style="width:auto;padding:10px 26px" onclick="openP(${p.id})">${t('shop')}</button></div></div>`}).join('')+`<div class="dots">${S.map((_,k)=>`<i class="${k==si?'on':''}" onclick="si=${k};drawSlider()"></i>`).join('')}</div><button class="ar l" onclick="stp(document.documentElement.dir=='rtl'?1:-1)">‹</button><button class="ar r" onclick="stp(document.documentElement.dir=='rtl'?-1:1)">›</button>`;
}
setInterval(()=>{if(sn>1&&!$('ov').classList.contains('on')){si=(si+1)%sn;drawSlider()}},5000);
$('ct').onclick=showCart;
$('q').oninput=e=>{qs=e.target.value.trim().toLowerCase();draw()};$('so').onchange=e=>{so=+e.target.value;draw()};
$('ov').onclick=e=>{if(e.target.id=='ov')$('ov').classList.remove('on')};
const esc=x=>String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function pub(){
  try{
    const a=await window.claude.use('artifact');
    const d=document.documentElement.cloneNode(true);
    d.setAttribute('lang','ar');d.setAttribute('dir','rtl');
    d.querySelector('#data').textContent=JSON.stringify(P).replace(/</g,'\\u003c');
    ['cats','grid','bx','lg','ct','h1','h2'].forEach(i=>d.querySelector('#'+i).textContent='');
    d.querySelector('#ov').className='ov';
    const ad=d.querySelector('#adm');if(ad)ad.remove();
    await a.publish('<!DOCTYPE html>\n'+d.outerHTML);
  }catch(e){alert('تعذر الحفظ: '+(e.code||e.message))}
}
function showAdmin(){
  $('ov').classList.add('on');
  $('bx').innerHTML=`<h3 style="margin:0 0 8px">⚙️ إدارة المنتجات</h3><button class="btn" onclick="editP(0)">+ إضافة منتج</button>`+P.map(p=>`<div class="row"><span>${esc(p.n[0])}<br><small>${p.p} ج.م · ${T.ar[p.k]}</small></span><span><button class="sz" onclick="editP(${p.id})">✏️</button> <button class="sz" onclick="delP(${p.id})">🗑️</button></span></div>`).join('')+`<button class="btn g" onclick="$('ov').classList.remove('on')">إغلاق</button>`;
}
function editP(id){
  const p=P.find(x=>x.id==id)||{id:0,k:'t',n:['',''],p:'',c:[],s:[]};
  $('bx').innerHTML=`<h3 style="margin:0 0 8px">${id?'تعديل منتج':'منتج جديد'}</h3>
  <input id="a1" placeholder="الاسم بالعربي" value="${esc(p.n[0])}"><input id="a2" placeholder="Name in English" dir="ltr" value="${esc(p.n[1])}"><input id="a3" type="number" placeholder="السعر بالجنيه" value="${p.p}">
  <select id="a4" style="width:100%;padding:10px;margin-bottom:8px;border-radius:10px">${['t','p','s','sw','hd','kn','jk'].map(k=>`<option value="${k}" ${k==p.k?'selected':''}>${T.ar[k]}</option>`).join('')}</select>
  <input id="a5" placeholder="المقاسات مفصولة بفاصلة: S, M, L" dir="ltr" value="${esc(p.s.join(', '))}">
  <b>الألوان المتاحة</b><div class="opts">${C.map((c,i)=>`<button class="cl ${p.c.includes(i)?'on':''}" data-i="${i}" style="background:${c[0]}" title="${c[1]}" onclick="this.classList.toggle('on')"></button>`).join('')}</div>
  <button class="btn" onclick="saveP(${p.id})">حفظ</button><button class="btn g" onclick="showAdmin()">رجوع</button>`;
}
async function saveP(id){
  const n=[$('a1').value.trim(),$('a2').value.trim()],pr=parseFloat($('a3').value),k=$('a4').value;
  const s=$('a5').value.split(',').map(x=>x.trim()).filter(Boolean);
  const c=[...document.querySelectorAll('#bx .cl.on')].map(b=>+b.dataset.i);
  if(!n[0]||!n[1]||isNaN(pr)||!s.length||!c.length){alert('اكمل كل البيانات: الاسمين والسعر والمقاسات ولون واحد على الأقل');return}
  if(id){Object.assign(P.find(x=>x.id==id),{n,p:pr,k,s,c})}else{P.push({id:Math.max(0,...P.map(x=>x.id))+1,k,n,p:pr,c,s})}
  draw();showAdmin();await pub();
}
async function delP(id){
  if(!confirm('متأكد إنك عايز تحذف المنتج ده؟'))return;
  P=P.filter(x=>x.id!=id);draw();showAdmin();await pub();
}
(async()=>{try{const u=await window.claude.use('user');if(u&&await u.isOwner()){const b=document.createElement('button');b.className='pill';b.id='adm';b.textContent='⚙️';b.onclick=showAdmin;$('ct').before(b)}}catch(e){}})();
draw();
</script>
</body>
</html>
