<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>one to one</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--panel:#fff;--ink:#000;--pri:#000;--acc:#000;--onacc:#fff;--line:#d4d4d4;--soft:#f0f0f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--panel:#111;--ink:#fff;--pri:#000;--acc:#fff;--onacc:#000;--line:#333;--soft:#1c1c1c}}
:root[data-theme="dark"]{--bg:#000;--panel:#111;--ink:#fff;--pri:#000;--acc:#fff;--onacc:#000;--line:#333;--soft:#1c1c1c}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif}
button{font-family:inherit;cursor:pointer;border:0}
header{border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:1px;direction:ltr}
.pill{background:rgba(255,255,255,.14);color:#fff;border-radius:99px;padding:8px 14px;font-weight:600;margin-inline-start:6px}
.banner{background:#0b0b0b;text-align:center}.banner img{display:block;margin:auto;width:100%;max-width:560px}
.hero{text-align:center;padding:34px 16px 12px}.hero h1{margin:0 0 6px;font-size:28px}.hero p{margin:0;opacity:.75}
.wrap{max-width:1000px;margin:auto;padding:0 16px 50px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:14px 0}
.cats button{white-space:nowrap;background:var(--soft);color:var(--ink);padding:9px 18px;border-radius:99px;font-weight:600}
.cats button.on,.sz.on{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer}
.card .img{background:var(--soft);padding:14px}.card .b{padding:10px 12px}.card b{color:var(--acc)}
svg.g{width:100%;height:150px;display:block}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:none;align-items:center;justify-content:center;padding:12px}
.ov.on{display:flex}
.box{background:var(--panel);border-radius:16px;max-width:520px;width:100%;max-height:92vh;overflow:auto;padding:16px}
.views{display:flex;gap:8px;margin:8px 0}.views button{flex:1;background:var(--soft);border-radius:10px;padding:4px;color:var(--ink);font-size:11px}
.views button.on{outline:2px solid var(--acc)}.views svg{height:46px;width:100%}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.sz{min-width:44px;padding:9px;border-radius:10px;background:var(--soft);color:var(--ink);font-weight:700}
.cl{width:34px;height:34px;border-radius:50%;border:2px solid var(--line)}.cl.on{outline:3px solid var(--acc)}
.btn{width:100%;padding:12px;border-radius:99px;background:var(--acc);color:var(--onacc);font-weight:800;margin-top:8px}
.btn.g{background:transparent;border:1px solid var(--line);color:var(--ink)}
.ask{background:var(--soft);border-radius:12px;padding:12px;margin-top:10px}
input,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-family:inherit;margin-bottom:8px}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
</style>
</head>

function garment(k,col,v,cls){
  const tf=v==2?'translate(22 0) scale(.55 1)':v==3?'translate(-30 -30) scale(1.6)':'';
  const extra=v==1?'':(k=='s'?'<path d="M50 14V94" stroke="#0004" stroke-width="1.5"/>':k=='t'?'<path d="M42 8Q50 22 58 8" fill="none" stroke="#0004" stroke-width="2"/>':'');
  return `<svg class="${cls||'g'}" viewBox="0 0 100 100"><g transform="${tf}"><path d="${G[k]}" fill="${col}" stroke="#0005" stroke-width="1.5"/>${extra}</g></svg>`;
}
function draw(){
  document.documentElement.lang=L;document.documentElement.dir=L=='ar'?'rtl':'ltr';
  $('h1').textContent=t('h1');$('h2').textContent=t('h2');$('lg').textContent=t('lang');
  $('ct').textContent='🛍️ '+t('cart')+' ('+cart.reduce((a,c)=>a+c.q,0)+')';
  $('cats').innerHTML=['all','t','p','s'].map(k=>`<button class="${k==cat?'on':''}" onclick="cat='${k}';draw()">${t(k)}</button>`).join('');
  $('grid').innerHTML=P.filter(p=>cat=='all'||p.k==cat).map(p=>`<div class="card" onclick="openP(${p.id})"><div class="img">${garment(p.k,C[p.c[0]][0],0)}</div><div class="b">${nm(p)}<br><b>${p.p} ${t('cur')}</b></div></div>`).join('');
}
function openP(id){sel={p:P.find(x=>x.id==id),c:0,s:null,v:0,ask:false};showP();$('ov').classList.add('on')}
function showP(){
  const{p,c,s,v,ask}=sel,col=C[p.c[c]][0];
  $('bx').innerHTML=`<h3 style="margin:0 0 4px">${nm(p)} — ${p.p} ${t('cur')}</h3>
  <div style="background:var(--soft);border-radius:12px;padding:10px">${garment(p.k,col,v,'g" style="height:230px')}</div>
  <div class="views">${t('views').map((x,i)=>`<button class="${i==v?'on':''}" onclick="sel.v=${i};showP()">${garment(p.k,col,i,'g')}${x}</button>`).join('')}</div>
  <b>${t('color')}: ${cn(p.c[c])}</b><div class="opts">${p.c.map((ci,i)=>`<button class="cl ${i==c?'on':''}" style="background:${C[ci][0]}" onclick="sel.c=${i};showP()"></button>`).join('')}</div>
  <b>${t('size')}</b><div class="opts">${p.s.map(z=>`<button class="sz ${z==s?'on':''}" onclick="sel.s='${z}';sel.ask=true;showP()">${z}</button>`).join('')}</div>
  ${ask?`<div class="ask">${t('ask').replace('{s}',s)}<button class="btn" onclick="addC(true)">${t('only')}</button><button class="btn g" onclick="addC(false)">${t('more')}</button></div>`:''}
  <button class="btn g" onclick="$('ov').classList.remove('on')">${t('close')}</button>`;
}
function addC(now){
  const{p,c,s}=sel,i=cart.find(x=>x.id==p.id&&x.c==p.c[c]&&x.s==s);
  if(i)i.q++;else cart.push({id:p.id,c:p.c[c],s,q:1});
  draw();if(now)showCart();else $('ov').classList.remove('on');
}
function total(){return cart.reduce((a,x)=>a+P.find(p=>p.id==x.id).p*x.q,0)}
function showCart(){
  $('ov').classList.add('on');
  $('bx').innerHTML=`<h3 style="margin:0">🛍️ ${t('cart')}</h3>`+(cart.length?cart.map((x,i)=>{const p=P.find(q=>q.id==x.id);return`<div class="row"><span>${x.q}× ${nm(p)}<br><small>${t('size')} ${x.s} · ${cn(x.c)}</small></span><span>${p.p*x.q} ${t('cur')}<br><a href="#" onclick="cart.splice(${i},1);draw();showCart();return false">${t('rm')}</a></span></div>`}).join('')+`<p><b>${t('total')}: ${total()} ${t('cur')}</b></p>
  <input id="n" placeholder="${t('name')}"><input id="ph" placeholder="${t('phone')}"><textarea id="ad" placeholder="${t('addr')}"></textarea>
  <button class="btn" onclick="send()">${t('send')}</button>`:`<p>${t('empty')}</p>`)+`<button class="btn g" onclick="$('ov').classList.remove('on')">${t('close')}</button>`;
}
function send(){
  const n=$('n').value.trim(),ph=$('ph').value.trim(),ad=$('ad').value.trim();
  if(!n||!ph||!ad){alert(t('fill'));return}
  const lines=cart.map(x=>{const p=P.find(q=>q.id==x.id);return`${x.q}x ${p.n[1]} | ${x.s} | ${C[x.c][2]} | ${p.p*x.q}`});
  const msg=`one to one - New order\n${lines.join('\n')}\nTotal: ${total()} EGP\nName: ${n}\nPhone: ${ph}\nAddress: ${ad}`;
  const u='https://wa.me/'+WA+'?text='+encodeURIComponent(msg);
  $('bx').innerHTML=`<h3 style="margin:0 0 8px">✅ ${L=='ar'?'الطلب جاهز':'Order ready'}</h3>
  <a class="btn" style="display:block;text-align:center;text-decoration:none" href="${u}" target="_blank" rel="noopener noreferrer">${L=='ar'?'افتح واتساب وابعت الطلب':'Open WhatsApp & send'}</a>
  <p style="font-size:13px">${L=='ar'?'لو واتساب مفتحش، انسخ الرسالة دي وابعتها على الرقم':'If WhatsApp does not open, copy this message and send it to'} <b dir="ltr">0${WA.slice(2)}</b></p>
  <textarea id="mg" readonly rows="7" onclick="this.select()">${msg}</textarea>
  <button class="btn g" onclick="var m=$('mg');m.select();try{navigator.clipboard.writeText(m.value)}catch(e){document.execCommand('copy')}">${L=='ar'?'نسخ الرسالة':'Copy message'}</button>
  <button class="btn g" onclick="$('ov').classList.remove('on')">${t('close')}</button>`;
}
$('lg').onclick=()=>{L=L=='ar'?'en':'ar';try{localStorage.setItem('o2o-lang',L)}catch(e){}draw();if($('ov').classList.contains('on'))sel&&document.querySelector('.views')?showP():showCart()};
$('ct').onclick=showCart;
$('ov').onclick=e=>{if(e.target.id=='ov')$('ov').classList.remove('on')};
const esc=x=>String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function pub(){
  try{
    const a=await window.claude.use('artifact');
    const d=document.documentElement.cloneNode(true);
    d.setAttribute('lang','ar');d.setAttribute('dir','rtl');
    d.querySelector('#data').textContent=JSON.stringify(P).replace(/</g,'\\u003c');
    ['cats','grid','bx','lg','ct','h1','h2'].forEach(i=>d.querySelector('#'+i).textContent='');
    d.querySelector('#ov').className='ov';
    const ad=d.querySelector('#adm');if(ad)ad.remove();
    await a.publish('<!DOCTYPE html>\n'+d.outerHTML);
  }catch(e){alert('تعذر الحفظ: '+(e.code||e.message))}
}
function showAdmin(){
  $('ov').classList.add('on');
  $('bx').innerHTML=`<h3 style="margin:0 0 8px">⚙️ إدارة المنتجات</h3><button class="btn" onclick="editP(0)">+ إضافة منتج</button>`+P.map(p=>`<div class="row"><span>${esc(p.n[0])}<br><small>${p.p} ج.م · ${T.ar[p.k]}</small></span><span><button class="sz" onclick="editP(${p.id})">✏️</button> <button class="sz" onclick="delP(${p.id})">🗑️</button></span></div>`).join('')+`<button class="btn g" onclick="$('ov').classList.remove('on')">إغلاق</button>`;
}
function editP(id){
  const p=P.find(x=>x.id==id)||{id:0,k:'t',n:['',''],p:'',c:[],s:[]};
  $('bx').innerHTML=`<h3 style="margin:0 0 8px">${id?'تعديل منتج':'منتج جديد'}</h3>
  <input id="a1" placeholder="الاسم بالعربي" value="${esc(p.n[0])}"><input id="a2" placeholder="Name in English" dir="ltr" value="${esc(p.n[1])}"><input id="a3" type="number" placeholder="السعر بالجنيه" value="${p.p}">
  <select id="a4" style="width:100%;padding:10px;margin-bottom:8px;border-radius:10px">${['t','p','s'].map(k=>`<option value="${k}" ${k==p.k?'selected':''}>${T.ar[k]}</option>`).join('')}</select>
  <input id="a5" placeholder="المقاسات مفصولة بفاصلة: S, M, L" dir="ltr" value="${esc(p.s.join(', '))}">
  <b>الألوان المتاحة</b><div class="opts">${C.map((c,i)=>`<button class="cl ${p.c.includes(i)?'on':''}" data-i="${i}" style="background:${c[0]}" title="${c[1]}" onclick="this.classList.toggle('on')"></button>`).join('')}</div>
  <button class="btn" onclick="saveP(${p.id})">حفظ</button><button class="btn g" onclick="showAdmin()">رجوع</button>`;
}
async function saveP(id){
  const n=[$('a1').value.trim(),$('a2').value.trim()],pr=parseFloat($('a3').value),k=$('a4').value;
  const s=$('a5').value.split(',').map(x=>x.trim()).filter(Boolean);
  const c=[...document.querySelectorAll('#bx .cl.on')].map(b=>+b.dataset.i);
  if(!n[0]||!n[1]||isNaN(pr)||!s.length||!c.length){alert('اكمل كل البيانات: الاسمين والسعر والمقاسات ولون واحد على الأقل');return}
  if(id){Object.assign(P.find(x=>x.id==id),{n,p:pr,k,s,c})}else{P.push({id:Math.max(0,...P.map(x=>x.id))+1,k,n,p:pr,c,s})}
  draw();showAdmin();await pub();
}
async function delP(id){
  if(!confirm('متأكد إنك عايز تحذف المنتج ده؟'))return;
  P=P.filter(x=>x.id!=id);draw();showAdmin();await pub();
}
(async()=>{try{const u=await window.claude.use('user');if(u&&await u.isOwner()){const b=document.createElement('button');b.className='pill';b.id='adm';b.textContent='⚙️';b.onclick=showAdmin;$('ct').before(b)}}catch(e){}})();
draw();
</script>
</body>
</html>
